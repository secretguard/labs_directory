<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Hands-on security labs, built to be broken.">
  <!-- Source for og.png. Fonts: Outfit, Inter, JetBrains Mono (self-hosted in web/assets/fonts). Re-render at 1200x630 after editing. -->
  <defs>
    <style>@font-face{font-family:'Outfit';font-weight:100 900;src:url('outfit-var.woff2') format('woff2');}@font-face{font-family:'Inter';font-weight:100 900;src:url('inter-var.woff2') format('woff2');}@font-face{font-family:'JetBrains Mono';font-weight:100 900;src:url('jetbrains-mono-var.woff2') format('woff2');}</style>
    <linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="fade"><rect x="0" y="0" width="1200" height="630" fill="url(#fg)"/></mask>
  </defs>
  <rect width="1200" height="630" fill="#0d0f0e"/>
  <pattern id="p" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="18" fill="#ffb454"/></pattern>
  <polygon points="1000,0 1200,0 1200,630 880,630" fill="url(#p)" opacity="0.10"/>
  <rect x="0" y="0" width="16" height="630" fill="#ffb454"/>
  <g class="illo" transform="translate(950,318) scale(0.92)">
    <circle r="215" fill="#ffb454" opacity="0.07"/><circle r="215" fill="none" stroke="#262b27" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-45,-180 H45 M-30,-180 V-70 L-140,120 C-155,150 -135,175 -105,175 H105 C135,175 155,150 140,120 L30,-70 V-180" fill="none" stroke="#ffb454" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-92,40 C-60,20 -20,60 20,40 C50,25 70,45 92,40 L140,120 C155,150 135,175 105,175 H-105 C-135,175 -155,150 -140,120 Z" fill="#ffb454" opacity="0.28"/>
    <circle cx="-40" cy="100" r="14" fill="none" stroke="#ffb454" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="130" r="9" fill="none" stroke="#ffb454" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="80" r="6" fill="#ffb454"/>
    <path d="M150,-120 H190 V-60 M-150,-100 H-200 V-20" fill="none" stroke="#8a9690" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="190" cy="-60" r="8" fill="#8a9690"/><circle cx="-200" cy="-20" r="8" fill="#8a9690"/>
  </g>
  <text class="p" x="84" y="94" font-family="JetBrains Mono" font-weight="500" font-size="24" fill="#ffb454">labs.sarathg.me</text>
  <text class="h" x="84" y="235" font-family="Outfit" font-weight="800" font-size="54" letter-spacing="-0.02em" fill="#e8e6df">Hands-on security</text>
  <text class="h" x="84" y="293" font-family="Outfit" font-weight="800" font-size="54" letter-spacing="-0.02em" fill="#e8e6df">labs, built to</text>
  <text class="h" x="84" y="351" font-family="Outfit" font-weight="800" font-size="54" letter-spacing="-0.02em" fill="#e8e6df">be broken.</text>
  <text class="s" x="84" y="399" font-family="Inter" font-weight="400" font-size="26" fill="#8a9690">OSINT, API security, SOC, social</text>
  <text class="s" x="84" y="435" font-family="Inter" font-weight="400" font-size="26" fill="#8a9690">engineering and more. Free to use.</text>
  <text class="f" x="84" y="560" font-family="Inter" font-weight="600" font-size="24" fill="#e8e6df">Sarath G</text>
  <text class="f" x="212" y="560" font-family="Inter" font-weight="400" font-size="24" fill="#8a9690">Cybersecurity consultant &amp; trainer</text>
</svg>
